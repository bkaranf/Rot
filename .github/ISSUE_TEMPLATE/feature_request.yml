name: Suggest an improvement
description: Describe a useful change to an existing Rot workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the current difficulty and the result you want.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: Optional. A small example is often enough.
