<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" role="img" aria-labelledby="title desc">
  <title id="title">Rot training workflow</title>
  <desc id="desc">Illustrative workflow. Watch in verified Free Play with game focus. Pause, mute and hide as training ends. Resume when enabled after verified training and game focus return.</desc>
  <rect x="1" y="1" width="598" height="468" rx="22" fill="#f4f5f7" stroke="#d9dde5" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="300" y="35" fill="#5b616b" font-size="24" font-weight="700">Rot · Illustrative workflow</text>
    <g fill="#fff" stroke="#dfe2e6" stroke-width="2">
      <rect x="24" y="54" width="552" height="116" rx="14"/>
      <rect x="24" y="194" width="552" height="116" rx="14"/>
      <rect x="24" y="334" width="552" height="116" rx="14"/>
    </g>
    <g fill="#e5383b" aria-hidden="true">
      <path d="M292 67 312 79 292 91Z"/>
      <rect x="289" y="207" width="8" height="24" rx="2"/>
      <rect x="303" y="207" width="8" height="24" rx="2"/>
      <path d="M292 347 312 359 292 371Z"/>
    </g>
    <g fill="#1c2025" font-size="30" font-weight="700">
      <text x="300" y="123">Verified Free Play</text>
      <text x="300" y="263">Training ends</text>
      <text x="300" y="403">Back to verified training</text>
    </g>
    <g fill="#3f4650" font-size="26">
      <text x="300" y="152">Watch with game focus.</text>
      <text x="300" y="292">Pause, mute and hide.</text>
      <text x="300" y="432">Auto-resume when enabled.</text>
    </g>
  </g>
  <g fill="none" stroke="#e5383b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M300 176v12m-6-6 6 6 6-6"/>
    <path d="M300 316v12m-6-6 6 6 6-6"/>
  </g>
</svg>
