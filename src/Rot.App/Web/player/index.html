<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Rot</title>
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="./player.css">
  </head>
  <body>
    <section id="player-window" class="player-window" aria-label="Rot YouTube player">
      <main class="player-shell">
        <div id="player-stage" class="player-stage" aria-live="polite">
          <div class="empty-state">
            <div class="empty-state__mark" aria-hidden="true">
              <img src="../assets/icon-color.png" alt="">
            </div>
            <p class="empty-state__slogan">Find your next video</p>
            <p class="empty-state__hint">Browse YouTube to get started. <kbd id="browse-hotkey">Ctrl+Shift+F</kbd></p>
            <button id="empty-browse-button" class="primary-button" type="button">Browse YouTube</button>
          </div>
        </div>
        <div id="player-notice" class="player-notice" role="status" aria-live="polite" hidden></div>
      </main>

      <header id="player-header" class="player-header">
        <div id="player-chrome" class="player-chrome" data-chrome>
          <span id="detection-dot" class="status-dot is-disconnected" role="img"
            title="Rocket League disconnected" aria-label="Rocket League disconnected"></span>
          <div class="player-controls" data-no-drag>
            <button id="browse-button" class="icon-button" type="button"
              title="Browse YouTube" aria-label="Browse YouTube">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="9" cy="9" r="5.5"></circle>
                <path d="m13.25 13.25 3.25 3.25"></path>
              </svg>
            </button>
            <button id="settings-button" class="icon-button" type="button"
              title="Open Settings" aria-label="Open Settings">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="10" r="2.5"></circle>
                <path d="M10 2.75v2M10 15.25v2M17.25 10h-2M4.75 10h-2M15.13 4.87l-1.42 1.42M6.29 13.71l-1.42 1.42M15.13 15.13l-1.42-1.42M6.29 6.29 4.87 4.87"></path>
              </svg>
            </button>
            <button id="close-button" class="icon-button icon-button--danger" type="button"
              title="Hide Rot" aria-label="Hide Rot">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M5 5l10 10M15 5L5 15"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="pass-through-status" class="pass-through-status" role="status"
          aria-live="polite" aria-atomic="true" hidden>
          <span>Pass-through</span>
          <kbd id="interactivity-hotkey">Ctrl+Shift+P</kbd>
        </div>
      </header>

      <button id="resize-grip" class="resize-grip" type="button"
        title="Drag to resize" aria-label="Resize Rot">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M17 9v8H9M17 4v2M4 17h2"></path>
          <path d="m17 9-8 8"></path>
        </svg>
      </button>
    </section>
    <script type="module" src="./player.js"></script>
  </body>
</html>
